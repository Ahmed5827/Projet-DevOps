name: Helpdesk App CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Python suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest

  build-and-push:
    name: Build & Push Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t ticket-management-system-projet-devops:latest .

      - name: Test Docker image
        run: docker run --rm ticket-management-system-projet-devops:latest python -m pytest

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Tag for Docker Hub
        run: docker tag ticket-management-system-projet-devops:latest ${{ secrets.DOCKER_USERNAME }}/ticket-management-system-projet-devops:latest

      - name: Push to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ticket-management-system-projet-devops:latest

  deploy:
    name: Deploy container
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Pull latest image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/ticket-management-system-projet-devops:latest

      - name: Stop & remove existing container
        run: |
          docker stop ticket-management-system-projet-devops || true
          docker rm ticket-management-system-projet-devops || true

      - name: Run container
        run: docker run -d -p 5000:5000 --name ticket-management-system-projet-devops ${{ secrets.DOCKER_USERNAME }}/ticket-management-system-projet-devops:latest
