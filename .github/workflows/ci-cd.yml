name: Ticket Management System CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Python suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest with coverage
        run: pytest --cov=app tests/ -v

  terraform-deploy:
    name: Deploy Container with Terraform
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Create infra directory if it doesn't exist
        run: mkdir -p infra

      - name: Create Terraform configuration
        run: |
          cat > infra/main.tf << 'EOF'
          terraform {
            required_providers {
              docker = {
                source  = "kreuzwerker/docker"
                version = "~> 3.0"
              }
            }
          }

          provider "docker" {}

          resource "docker_image" "myapp" {
            name = "myapp"
            build {
              context = "${path.module}/.."
            }
          }

          resource "docker_container" "myapp" {
            name = "myapp"
            image = docker_image.myapp.latest

            ports {
              internal = 5000
              external = 5000
            }
          }
          EOF

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra

      

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./infra