name: Ticket Management System CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Python suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest with coverage
        run: pytest --cov=app tests/ -v

  terraform-deploy:
    name: Deploy Container with Terraform
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Create infra directory if it doesn't exist
        run: mkdir -p infra

      - name: Create Terraform configuration
        run: |
          cat > infra/main.tf << 'EOF'
          terraform {
            required_providers {
              docker = {
                source  = "kreuzwerker/docker"
                version = "~> 3.0"
              }
            }
          }

          # For CI/CD on GitHub Actions (Ubuntu)
          provider "docker" {}

          # First remove any existing container with the same name
          resource "null_resource" "cleanup_existing" {
            provisioner "local-exec" {
              command = "docker rm -f myapp 2>/dev/null || true"
            }
          }

          # Build the Docker image
          resource "docker_image" "myapp" {
            name       = "myapp:latest"
            depends_on = [null_resource.cleanup_existing]
            build {
              context = "${path.module}/.."
              tag     = ["myapp:latest"]
            }
          }

          # Run the container
          resource "docker_container" "myapp" {
            name       = "myapp"
            image      = docker_image.myapp.image_id
            depends_on = [docker_image.myapp]

            ports {
              internal = 5000
              external = 5000
            }

            # Add health check
            healthcheck {
              test         = ["CMD", "curl", "-f", "http://localhost:5000"]
              interval     = "10s"
              timeout      = "5s"
              start_period = "5s"
              retries      = 3
            }
          }
          EOF

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra

      - name: Terraform Plan
        run: terraform plan
        working-directory: ./infra

      - name: Terraform Apply
        id: terraform_apply
        run: terraform apply -auto-approve
        working-directory: ./infra
        continue-on-error: true

      - name: Check Terraform Apply Result
        if: steps.terraform_apply.outcome == 'failure'
        run: |
          echo "Terraform apply failed. Checking for common issues..."
          docker ps -a
          echo "Checking Docker logs for any existing containers:"
          docker logs myapp 2>/dev/null || echo "No existing container logs found."
          echo "Attempting to fix by removing any existing containers and images..."
          docker rm -f myapp 2>/dev/null || true
          docker rmi myapp:latest 2>/dev/null || true
          echo "Retrying Terraform apply..."
          terraform apply -auto-approve
        working-directory: ./infra

      - name: Verify Deployment
        run: |
          echo "Waiting for container to start..."
          sleep 10
          docker ps
          echo "Checking if application is responding..."
          curl -s http://localhost:5000 || echo "Application not responding yet, may need more time to initialize."
          echo "Deployment verification complete."